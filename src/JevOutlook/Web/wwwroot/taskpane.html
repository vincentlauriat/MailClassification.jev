<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jevOutlook</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    :root { --ink:#1f2328; --muted:#6b7280; --line:#e5e7eb; --bg:#f7f8fa; --card:#fff; --accent:#0f6cbd; --good:#137a4b; --warn:#9a4a00; --bad:#b42318; }
    * { box-sizing: border-box; }
    body { margin:0; font: 13px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif; color:var(--ink); background:var(--bg); }
    header { display:flex; align-items:center; gap:8px; padding:10px 12px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; }
    header img { width:22px; height:22px; }
    header b { font-size:14px; }
    header .status { margin-left:auto; font-size:11px; color:var(--muted); text-align:right; }
    main { padding:10px 12px 20px; display:grid; gap:10px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
    .card h2 { margin:0 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
    .subject { font-weight:600; margin:2px 0; word-break:break-word; }
    .from { color:var(--muted); font-size:12px; word-break:break-word; }
    .row { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; align-items:center; }
    button { font:inherit; padding:6px 10px; border-radius:8px; border:1px solid var(--line); background:var(--card); cursor:pointer; }
    button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
    button.warn { border-color:#f0c9a6; background:#fff4e8; color:var(--warn); }
    button:disabled { opacity:.55; cursor:default; }
    .pill { display:inline-block; padding:2px 8px; border-radius:999px; border:1px solid var(--line); font-size:11px; background:var(--bg); }
    .pill.spam { border-color:#efd3d3; background:#fff7f7; color:var(--bad); }
    .pill.good { border-color:#cce7dc; background:#f1faf6; color:var(--good); }
    .result { margin-top:8px; }
    .result .label { font-size:16px; font-weight:700; }
    .bar { display:grid; grid-template-columns: 1fr auto; gap:2px 8px; font-size:11px; margin-top:6px; }
    .bar .track { grid-column:1 / span 2; height:4px; background:var(--bg); border-radius:2px; overflow:hidden; margin-bottom:4px; }
    .bar .fill { height:100%; background:var(--accent); }
    .note { font-size:11px; color:var(--muted); margin-top:6px; }
    .note.live { color:var(--warn); }
    .msg { font-size:12px; margin-top:6px; }
    .msg.error { color:var(--bad); }
    .msg.ok { color:var(--good); }
    label.inline { display:flex; gap:6px; align-items:center; font-size:12px; }
    select, input[type=number] { font:inherit; padding:4px 6px; border:1px solid var(--line); border-radius:6px; background:var(--card); }
    .progress { font-size:12px; margin-top:6px; }
    ul.mini { list-style:none; padding:0; margin:6px 0 0; font-size:11px; }
    ul.mini li { padding:3px 0; border-top:1px solid var(--line); display:flex; gap:6px; }
    ul.mini li span:first-child { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    a { color:var(--accent); }
  </style>
</head>
<body>
  <header>
    <img src="logo.svg" alt="">
    <b>jevOutlook</b>
    <div class="status" id="status">Connecting…</div>
  </header>
  <main>
    <section class="card" id="itemCard">
      <h2>This message</h2>
      <div class="subject" id="subject">Open a message in Outlook to classify it.</div>
      <div class="from" id="from"></div>
      <div class="row">
        <button class="primary" id="classifyBtn" onclick="classifyCurrent()">Classify with Jev</button>
      </div>
      <div class="result" id="result" hidden>
        <div><span class="label" id="resLabel"></span> <span class="pill" id="resConf"></span> <span class="pill" id="resStage"></span></div>
        <div class="bar" id="resBars"></div>
        <div class="row">
          <button class="primary" id="applyBtn" onclick="applyCurrent(false)">Apply category</button>
          <button class="warn" id="archiveBtn" onclick="applyCurrent(true)" hidden>Apply + archive</button>
        </div>
        <div class="note" id="resNote">Nothing is changed in Outlook until you click Apply.</div>
      </div>
      <div class="msg" id="itemMsg"></div>
    </section>

    <section class="card">
      <h2>Inbox run</h2>
      <div class="row">
        <label class="inline">Limit <select id="limit"><option>10</option><option>50</option><option>100</option><option value="all">all</option></select></label>
        <label class="inline"><input type="checkbox" id="dryRun" checked onchange="renderMode()"> Preview only</label>
      </div>
      <div class="row">
        <label class="inline">Mode <select id="mode" onchange="renderMode()"><option value="labels">categories only</option><option value="labels_archive">categories + archive</option></select></label>
        <label class="inline"><input type="checkbox" id="unreadOnly" checked> unread only</label>
      </div>
      <div class="note" id="modeNote"></div>
      <div class="row">
        <button class="primary" id="runBtn" onclick="startRun()">Start</button>
        <button id="stopBtn" onclick="stopRun()" hidden>Stop</button>
      </div>
      <div class="progress" id="progress"></div>
      <ul class="mini" id="mini"></ul>
      <div class="msg" id="runMsg"></div>
    </section>

    <div class="note">Full dashboard: <a id="dashLink" href="#" target="_blank" rel="noopener">open in the browser</a> · model <span id="model"></span></div>
  </main>

  <script>
    var state = { itemId: null, restId: null, last: null, job: null, looping: false, stop: false };

    function api(name) {
      var args = Array.prototype.slice.call(arguments, 1);
      return fetch('/api/' + name, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(args) })
        .then(function(r) { return r.text().then(function(t) { var d = null; try { d = t ? JSON.parse(t) : null; } catch (e) {} if (r.ok) return d; throw new Error(d && d.error ? d.error : 'HTTP ' + r.status); }); });
    }
    function el(id) { return document.getElementById(id); }
    function say(id, text, cls) { var n = el(id); n.textContent = text || ''; n.className = 'msg' + (cls ? ' ' + cls : ''); }

    function renderMode() {
      var dry = el('dryRun').checked, archive = el('mode').value === 'labels_archive';
      var n = el('modeNote');
      n.className = 'note' + (dry ? '' : ' live');
      n.textContent = dry ? 'PREVIEW: nothing is changed in Outlook.' : ('LIVE: categories are applied to your mailbox' + (archive ? ' and eligible messages are archived.' : '.'));
    }

    function refreshStatus() {
      return Promise.all([api('authStatus'), api('getUiState')]).then(function(r) {
        var auth = r[0], ui = r[1];
        el('model').textContent = ui.model || '';
        el('dashLink').href = ui.dashboardUrl || 'http://127.0.0.1:5177/';
        el('status').textContent = (auth.signedIn ? auth.account.replace(/<.*>/, '').trim() : 'Not signed in — use the dashboard') + (ui.hasSavedKey ? '' : ' · no API key');
        // Jobs are kept per mailbox; the pane works on the default (first Microsoft 365) one.
        state.job = (ui.jobs && ui.defaultAccount) ? ui.jobs[ui.defaultAccount] : null;
        if (state.job && state.job.status === 'running') renderJob(state.job);
      }).catch(function(e) { el('status').textContent = 'Local server unreachable: ' + e.message + ' — run "jevoutlook service status", then "jevoutlook service restart" (or "service install" once).'; });
    }

    // ----- current message -----
    function bindItem() {
      var item = Office.context && Office.context.mailbox && Office.context.mailbox.item;
      if (!item) { el('subject').textContent = 'No message selected. You can still classify the latest inbox message.'; el('from').textContent = ''; state.restId = 'latest'; return; }
      state.restId = Office.context.mailbox.convertToRestId(item.itemId, Office.MailboxEnums.RestVersion.v2_0);
      el('subject').textContent = item.subject || '(no subject)';
      var f = item.from; el('from').textContent = f ? ((f.displayName ? f.displayName + ' ' : '') + '<' + f.emailAddress + '>') : '';
      el('result').hidden = true; say('itemMsg', '');
    }

    function classifyCurrent() {
      if (!state.restId) return;
      el('classifyBtn').disabled = true; say('itemMsg', 'Classifying…');
      api('classifyItem', state.restId).then(function(res) {
        state.last = res;
        if (state.restId === 'latest') { el('subject').textContent = res.subject || '(no subject)'; el('from').textContent = res.from || ''; }
        el('resLabel').textContent = res.final.label;
        el('resConf').textContent = 'confidence ' + res.final.confidence.toFixed(3);
        el('resStage').textContent = res.final.stage === 'full' ? 'full-content review' : 'metadata only';
        el('resStage').className = 'pill'; el('resConf').className = 'pill ' + (res.final.confidence >= 0.75 ? 'good' : '');
        var bars = el('resBars'); bars.textContent = '';
        (res.final.probabilities || []).slice(0, 5).forEach(function(p) {
          // Labels come from the mailbox/rules: build nodes, never HTML strings.
          var name = document.createElement('span'); name.textContent = p.label;
          var pct = document.createElement('span'); pct.textContent = (p.p * 100).toFixed(1) + '%';
          var track = document.createElement('div'); track.className = 'track';
          var fill = document.createElement('div'); fill.className = 'fill'; fill.style.width = Math.max(0, Math.min(100, p.p * 100)).toFixed(1) + '%';
          track.appendChild(fill);
          bars.appendChild(name); bars.appendChild(pct); bars.appendChild(track);
        });
        el('archiveBtn').hidden = !res.final.spam;
        el('resNote').textContent = res.alreadyTriaged ? 'This message already carries a configured category (' + res.categories.join(', ') + '). Applying adds the new one without removing existing categories.' : 'Nothing is changed in Outlook until you click Apply.';
        el('result').hidden = false;
        say('itemMsg', 'Cost $' + res.costUsd.toFixed(6) + (res.stages.length > 1 ? ' · metadata was uncertain, the body was reviewed too.' : ''), 'ok');
      }).catch(function(e) { say('itemMsg', e.message, 'error'); }).finally(function() { el('classifyBtn').disabled = false; });
    }

    function applyCurrent(archive) {
      if (!state.last) return;
      el('applyBtn').disabled = true; el('archiveBtn').disabled = true; say('itemMsg', archive ? 'Applying category and archiving…' : 'Applying category…');
      api('applyItem', state.last.id, state.last.final.ruleId, archive).then(function(res) {
        say('itemMsg', (archive && res.archived ? 'Category applied and message moved to Archive.' : 'Category applied: ' + res.categories.join(', ')), 'ok');
      }).catch(function(e) { say('itemMsg', e.message, 'error'); }).finally(function() { el('applyBtn').disabled = false; el('archiveBtn').disabled = false; });
    }

    // ----- inbox run (same loop as the dashboard) -----
    function startRun() {
      var options = { limit: el('limit').value, dryRun: el('dryRun').checked, unreadOnly: el('unreadOnly').checked, mode: el('mode').value,
        maxSpendUsd: 0.10, metadataThreshold: 0.75, archiveThreshold: 0.93, scope: 'inbox' };
      if (!options.dryRun && options.mode === 'labels_archive' && !confirm('LIVE run with archiving: eligible messages will be moved to Archive. Continue?')) return;
      el('runBtn').disabled = true; el('mini').textContent = ''; say('runMsg', ''); state.stop = false;
      api('startTriageJob', options).then(function(res) { state.job = res.job; renderJob(res.job); appendRows(res.results); loop(); })
        .catch(function(e) { say('runMsg', e.message, 'error'); el('runBtn').disabled = false; });
    }
    function loop() {
      if (!state.job || state.job.status !== 'running' || state.stop) { finishRun(); return; }
      state.looping = true; el('stopBtn').hidden = false;
      api('processNextBatch', state.job.id, '').then(function(res) { state.job = res.job; renderJob(res.job); appendRows(res.results); (res.events || []).forEach(function(ev) { if (ev.level !== 'info') say('runMsg', ev.message, ev.level === 'error' ? 'error' : ''); }); loop(); })
        .catch(function(e) { say('runMsg', e.message, 'error'); finishRun(); });
    }
    function stopRun() { state.stop = true; if (state.job) api('cancelTriageJob', '').then(function(r) { if (r.job) { state.job = r.job; renderJob(r.job); } }).catch(function(e) { say('runMsg', e.message, 'error'); }); }
    function finishRun() { state.looping = false; el('stopBtn').hidden = true; el('runBtn').disabled = false; if (state.job && state.job.status !== 'running') say('runMsg', (state.job.dryRun ? 'Preview ' : 'Live run ') + state.job.status + (state.job.stopReason ? ' (' + state.job.stopReason + ')' : '') + (state.job.dryRun ? ' — no Outlook changes.' : ''), state.job.status === 'completed' ? 'ok' : ''); }
    function renderJob(j) {
      var handled = (j.processed || 0) + (j.skipped || 0);
      el('progress').textContent = (j.dryRun ? 'PREVIEW · ' : 'LIVE · ') + handled + ' / ' + (j.target || '?') + ' · $' + Number(j.spentUsd || 0).toFixed(4) + ' · ' + j.status;
    }
    function appendRows(rows) {
      (rows || []).forEach(function(r) {
        // Subjects are attacker-controlled (email content): text nodes only.
        var li = document.createElement('li');
        var subject = document.createElement('span'); subject.title = r.subject || ''; subject.textContent = r.subject || '(no subject)';
        var label = document.createElement('span'); label.className = 'pill'; label.textContent = r.label || '';
        li.appendChild(subject); li.appendChild(label);
        el('mini').insertBefore(li, el('mini').firstChild);
      });
      while (el('mini').children.length > 12) el('mini').removeChild(el('mini').lastChild);
    }

    // ----- boot -----
    renderMode();
    function boot() { refreshStatus(); bindItem(); }
    if (window.Office && Office.onReady) {
      Office.onReady(function() {
        boot();
        try { Office.context.mailbox.addHandlerAsync(Office.EventType.ItemChanged, function() { state.last = null; bindItem(); }); } catch (e) {}
      });
    } else { boot(); }
  </script>
</body>
</html>
